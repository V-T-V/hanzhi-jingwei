# 汉志经纬 · push/PR 门禁（承系列 ci.yml 结构）
# run_tests.py 自跑无头浏览器断言页（TESTLOG 协议），不挑浏览器内核：
# 探测顺序 HS_BROWSER → Edge → Chrome（run_tests.py CANDS，env 优先即 Linux 便携）。
# CI 注入 HS_BROWSER=/usr/bin/google-chrome + HS_BASE 指向自起服务，其余步骤照本地口径原样跑
#（run_tests 步骤⑤含 offline_check 四验：SW 在位 · 真断网重载 · 数据层离线可得 · 3D 断网直航）。
# 依赖说明：本站测试栈（run_tests.py / tools/lint.py / tools/offline_check.py）纯 stdlib，无需 pip。
name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 浏览器存在性检验
        run: |
          # 系列教训（承 HHH ci.yml）：ubuntu 镜像迁移期 chromium-browser 是 snap
          # 过渡壳，容器内不可用且 || true 吞错把「确定坏」变「随机坏」——
          # CI 一律用 runner 预装 Chrome，缺件即红，绝不兜底
          test -x /usr/bin/google-chrome && /usr/bin/google-chrome --version
      - name: 起本地服务
        run: |
          python -m http.server 9800 --bind 127.0.0.1 &
          # 就绪探针：重试只治冷启动竞态，起不来照样红（非吞错）
          curl -sf --retry 8 --retry-delay 2 --retry-connrefused http://127.0.0.1:9800/index.html -o /dev/null && echo server-up
      - name: 无头回归 run_tests.py（lint 16 类 + 21 数据断言 + 3 TESTLOG 断言页 + 账目 + 离线四验）
        env:
          HS_BROWSER: /usr/bin/google-chrome
          HS_BASE: http://127.0.0.1:9800/
        run: python run_tests.py
