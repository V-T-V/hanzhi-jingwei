<!DOCTYPE html>
<html lang="zh-CN">
<head>
<base href="../">
<meta charset="UTF-8">
<title>自动验证 · 汉志经纬</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<script>window.__NOTILES__=1;/* 测试密封：不拉外网瓦片 */</script>
<script src="vendor/leaflet.js"></script>
<link rel="stylesheet" href="css/main.css?v=1">
</head>
<body class="nopanel">
<div id="map"></div>
<div class="paper-wash"></div><div class="grain"></div>
<header>
  <div class="brand"><div class="seal">漢志</div>
  <div><h1>汉志经纬</h1><p>自动验证页</p></div></div>
  <div id="searchwrap"><input id="search"><div id="sresults"></div></div>
</header>
<aside id="rail"><div class="rt" id="railtitle"></div><div id="raillist"></div></aside>
<section id="panel"><button id="pclose">✕</button>
  <div class="vtitle"><div class="vname" id="vname"></div><div class="vseal" id="vseal">漢志</div></div>
  <div id="pbody"></div></section>
<footer><span id="bookstat"></span>
  <div class="right"><span class="link" id="aboutlink">关于 · 版本记</span></div></footer>
<div class="north"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#f5eeda"/></svg></div>
<div id="boot"><div class="bseal">漢志</div><h2>汉志经纬</h2><div class="go">展 卷</div></div>
<pre id="testlog" style="position:fixed;left:8px;top:8px;z-index:999;background:#fff;border:2px solid #a8391f;padding:8px;font:12px/1.6 monospace;max-width:460px;white-space:pre-wrap"></pre>

<script src="data/site_data.js" defer></script>
<script src="data/xref_yh.js" defer></script>
<script src="js/config.js?v=1" defer></script>
<script src="js/map.js?v=1" defer></script>
<script src="js/panels.js?v=1" defer></script>
<script src="js/rail.js?v=1" defer></script>
<script src="js/search.js?v=1" defer></script>
<script src="js/reader.js?v=1" defer></script>
<script src="js/ft_core.js?v=1" defer></script>
<script src="js/fulltext.js?v=1" defer></script>
<script src="js/app.js?v=1" defer></script>
<script src="js/modes.js?v=1" defer></script>
<script defer>
window.addEventListener("load", () => {
  const log = [];
  const P = (n, ok) => log.push(n + " " + (ok ? "PASS" : "FAIL"));
  const done = () => {
    document.getElementById("testlog").textContent =
      "TESTLOG\n" + log.join("\n") + "\nENDLOG";
    document.title = log.some(l => l.includes("FAIL")) ? "HAS-FAIL" : "ALL-PASS";
  };
  dismissBoot();
  setTimeout(() => {
    try {
      // ① 数据与统计
      P("DATA bu=14", HZ.bu.length === 14);
      const nJun = HZ.bu.reduce((s, b) => s + b.states.length, 0);
      P("DATA juns=103 (" + nJun + ")", nJun === 103);
      const nOk = HZ.bu.reduce((s, b) => s + b.states.filter(u => u.ok).length, 0);
      P("DATA list-reconciled=103 (" + nOk + ")", nOk === 103);
      const nX = HZ.bu.reduce((s, b) => s + b.states.reduce((t, u) => t + u.xian.length, 0), 0);
      P("DATA counties=1578 (" + nX + ")", nX === 1578);
      P("DATA totals-empire", HZ.meta.totals.hu === 12233062 && HZ.meta.totals.kou === 59594978);
      P("DATA bookstat", document.getElementById("bookstat").textContent.includes("郡国"));
      // ② 纲目
      const buRows = document.querySelectorAll("#raillist .ri-bu");
      P("RAIL bu-rows=14", buRows.length === 14);
      const subRows = document.querySelectorAll("#raillist .rsub[data-jun]");
      P("RAIL jun-rows=103 (" + subRows.length + ")", subRows.length === 103);
      // ③ 郡印上图
      let markerN = 0;
      for (const id in junMarkers) markerN += junMarkers[id].length;
      P("MAP markers>=103 (" + markerN + ")", markerN >= 103);
      P("MAP seat-layer (首县微点)", !!seatLayer);
      // ④ 部域晕 + 玄墨着色开关
      hullsOn = true; drawHulls();
      const hullN = Object.keys(hullLayer._layers || {}).length;
      P("MAP hulls-on>=10 (" + hullN + ")", hullN >= 10);
      hullsOn = false; drawHulls();
      document.body.classList.add("mono");
      P("MAP mono-toggle", document.body.classList.contains("mono"));
      document.body.classList.remove("mono");
      // ⑤ 郡卡（弘农郡：户118091 县11）
      const bu = HZ.bu.find(b => b.id === "sili");
      const hg = bu.states.find(s => s.n === "弘農郡");
      openJun(bu, hg);
      P("PANEL open-jun", document.getElementById("panel").classList.contains("open"));
      P("PANEL vname=弘農", document.getElementById("vname").textContent.includes("弘"));
      const chips = document.querySelectorAll("#pbody .chip:not(.bdg)");
      P("PANEL xian-chips=11 (" + chips.length + ")", chips.length === 11);
      P("PANEL hukou-verbatim", document.getElementById("pbody").textContent.includes("戸十一萬八千九十一"));
      P("PANEL mang-badge 铁官", document.getElementById("pbody").textContent.includes("铁官"));
      P("PANEL hash-write", location.hash.includes("bu=sili"));
      // ⑥ 阅读器：郡条原文懒加载
      openJunText(bu, hg);
      setTimeout(() => {
        try {
          const tps = document.querySelectorAll("#pbody .tp");
          P("READER paras>=11 (" + tps.length + ")", tps.length >= 11);
          const hd = document.querySelector("#pbody .tp .hd");
          P("READER heading-para", !!hd);
          const zhun = document.querySelector("#pbody .tp .zhun");
          P("READER note-small (夹注小字)", !!zhun);
          P("READER tmeta-字数", document.getElementById("pbody").textContent.includes("字"));
          // 夜读
          const nb2 = document.getElementById("tnight");
          nb2.click();
          P("READER night-on", document.getElementById("panel").classList.contains("panel-night"));
          nb2.click();
          // ⑦ 检索
          const hits = searchHits("長安");
          P("SEARCH hits-長安>=1 (" + hits.length + ")", hits.length >= 1);
          const hits2 = searchHits("秦地");
          P("SEARCH hits-秦地>=1 (" + hits2.length + ")", hits2.length >= 1);
          // ⑧ 关于页
          openAbout();
          P("ABOUT missing-note 上下两卷俱全", document.getElementById("pbody").textContent.includes("两卷俱全"));
          P("ABOUT 户口对账", document.getElementById("pbody").textContent.includes("分计"));
          // ⑨ 书签
          BM.toggle(bu, hg);
          P("BM saved", BM.load().some(b => b.n === "弘農郡"));
          BM.toggle(bu, hg);
          P("BM removed", !BM.load().some(b => b.n === "弘農郡"));
          // ⑩ 域分风俗
          openRegion("秦地");
          setTimeout(() => {
            try {
              P("YF region-panel", document.getElementById("pbody").textContent.includes("東井"));
              P("YF hash-write", decodeURIComponent(location.hash).includes("yf=秦地"));
              // ⑪ P2 汉唐对照（互查桥）
              P("XREF data-loaded", typeof HZXREF === "object" && HZXREF.meta.han_juns === 103);
              const mrows = HZXREF.rows.filter(r => r.m);
              P("XREF matched>=45 (" + mrows.length + ")", mrows.length >= 45);
              P("XREF unmatched-counted", HZXREF.meta.matched + HZXREF.meta.unmatched === HZXREF.meta.han_juns);
              openXref();
              let pb = document.getElementById("pbody");
              P("XREF panel-kicker", pb.textContent.includes("郡治↔州治对照"));
              const xgo = pb.querySelector("a.xgo");
              P("XREF deeplink-../YHJZ/", !!xgo && xgo.getAttribute("href").indexOf("../YHJZ/#dao=") === 0);
              P("XREF samples-han-text", pb.textContent.includes("漢書地理志") || pb.textContent.includes("元和郡县"));
              P("XREF why-missing-juan", pb.textContent.includes("佚") || pb.textContent.includes("桥无所出"));
              // ⑫ 深链复原
              openBu(HZ.bu.find(b => b.id === "yu"));
              P("DEEP bu-panel", document.getElementById("vname").textContent.includes("豫"));
              done();
            } catch (e) { P("YF-ERR " + e, false); done(); }
          }, 900);
        } catch (e) { P("READER-ERR " + e, false); done(); }
      }, 1600);
    } catch (e) { P("AUTO-ERR " + e, false); done(); }
  }, 2500);
});
</script>
</body>
</html>
